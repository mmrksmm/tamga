# Публичный запуск на сервере: docker compose up -d --build
# Нужен файл .env (см. .env.example) с DOMAIN, POSTGRES_PASSWORD и остальными настройками.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tamga
      POSTGRES_USER: tamga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamga"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        WITH_TTS: ${WITH_TTS:-0}
        WITH_ASR: ${WITH_ASR:-1}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tamga:${POSTGRES_PASSWORD}@db:5432/tamga
    volumes:
      - appdata:/srv/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      args:
        WITH_TTS: ${WITH_TTS:-0}
        WITH_ASR: ${WITH_ASR:-1}
    command: ["python", "bot.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tamga:${POSTGRES_PASSWORD}@db:5432/tamga
    volumes:
      - appdata:/srv/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  caddy_data:
